<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="dynamicTable (tableTitle, tableJsonString, idPrefix, maxBodyHeight)"
     th:id="${idPrefix + '-table-container'}"
     class="dynamic-table-fragment-container card">

    <div class="card-header">
        <h3 th:text="${tableTitle}">Dynamic Table</h3>
    </div>

    <div class="card-body">
        <div th:id="${idPrefix + '-render-root'}">
            Loading data...
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                // The JSON string is passed directly. Thymeleaf embeds it as a JavaScript literal.
                // Wrapping the fallback in quotes ensures valid JS syntax when th:inline="javascript" evaluates string expressions.
                const dataJsonString = /*[[${tableJsonString}]]*/ '';

                const rootElementId = [[${idPrefix + '-render-root'}]]; // Target div ID
                const height = [[${maxBodyHeight}]]; // Maximum height for scrolling
                const title = [[${tableTitle}]]; // Title for the JS renderer

                // Only render if the JSON string is neither null, "null" (as a string), nor "[]" (empty array)
                if (dataJsonString && dataJsonString !== 'null' && dataJsonString !== '[]') {
                    // console.log(`Rendering table for ${rootElementId} with data: ${dataJsonString.substring(0, 100)}...`); // Debugging
                    renderDynamicTableFromJson(dataJsonString, rootElementId, height, title);
                } else {
                    // Display an appropriate message when no data is available
                    document.getElementById(rootElementId).innerHTML = '<p>No data available.</p>';
                }
            });
        </script>
    </div>
</div>

</body>
</html>
