<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default-layout}">
<head>
    <title>Error - Unknown Actor</title>
</head>
<body>
<div layout:fragment="content">
    <h1 style="color: #dc3545;">Error: Unknown Actor Type</h1>
    <p>Your Actor ID could not be matched to any known actor type.</p>
    <p>Please contact support or verify your login credentials.</p>
    <p th:if="${initialActorId}">Your ID: <strong th:text="${initialActorId}"></strong></p>
    <p><a th:href="@{/app/login}" style="color: #007bff;">Back to Login Page</a></p>
</div>
</body>
</html>
