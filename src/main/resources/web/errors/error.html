<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default-layout}">
<head>
    <title th:text="${pageTitle != null ? pageTitle : 'Error'}">Error</title>
    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" th:href="@{/css/error.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="error-container">
        <div class="error-details">
            <h1 th:text="${status}">404</h1>
            <p th:text="${errorMessage != null ? errorMessage : 'An error has occurred.'}"></p>
            <p th:if="${message != null and message != ''}" th:text="${message}"></p>
            <p th:if="${path != null and path != ''}">The requested URL <code th:text="${path}"></code> was not found on this server.</p>
            <p th:if="${exceptionMessage != null and exceptionMessage != ''}" class="exception-message" th:text="${exceptionMessage}"></p>
            <p>That is all we know.</p>
            <a th:href="@{/app/dashboard}" class="back-to-home">Back</a> </div>
    </div>
</div>
</body>
</html>
