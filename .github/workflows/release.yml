name: Create Release and Push Docker Images

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Package, Push Docker Images and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Backend & Frontend Builds
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Backend Application with Gradle
        run: ./gradlew bootJar -PnewVersion=${{ github.ref_name }} --no-daemon

      - name: Build Frontend Application with Gradle
        run: ./gradlew -p frontend bootJar -PnewVersion=${{ github.ref_name }} --no-daemon

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend Docker image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pharmalink

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata for Frontend UI Docker image
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pharmalink-ui

      - name: Build and push Frontend UI Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

      - name: Set up JDK 11 for Chaincode Build
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build and Package All Chaincodes
        run: |
          set -e

          FABRIC_VERSION="2.5.13"
          echo "--- Downloading Fabric v${FABRIC_VERSION} ---"
          curl -fsSL "https://github.com/hyperledger/fabric/releases/download/v${FABRIC_VERSION}/hyperledger-fabric-linux-amd64-${FABRIC_VERSION}.tar.gz" | tar xz

          export PATH="$(pwd)/bin:$PATH"
          export FABRIC_CFG_PATH="$(pwd)/config"
          echo "--- PATH and FABRIC_CFG_PATH set. ---"

          mkdir -p staging/chaincode-packages

          echo "--- Finding, building, and packaging all chaincode projects ---"
          for project in $(find chaincode -mindepth 1 -maxdepth 1 -type d -name "pharmalink*"); do
            CC_NAME=$(basename "${project}")
            CC_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')

            echo "--> Building ${project} with Gradle"
            ./gradlew -p "${project}" build -x jacocoTestCoverageVerification --no-daemon

            echo "--> Packaging ${CC_NAME} with version ${{ github.ref_name }}"
            peer lifecycle chaincode package "staging/chaincode-packages/${CC_NAME}-${{ github.ref_name }}.tar.gz" --path "${project}" --lang java --label "${CC_NAME}_${CC_VERSION}"
          done

      - name: Package Application and Chaincodes for Release
        run: |
          mkdir -p release-package/app
          mkdir -p release-package/chaincode

          echo "--- Packaging backend and frontend applications ---"
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -exec cp {} release-package/app/ \;
          find frontend/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -exec cp {} release-package/app/ \;
          cp -r scripts docker common release-package/

          echo "--- Packaging Fabric chaincodes (.tar.gz) ---"
          cp -r staging/chaincode-packages/*.tar.gz release-package/chaincode/

          echo "--- Final package structure ---"
          ls -R release-package

          (cd release-package && zip -r "../pharmalink-${{ github.ref_name }}.zip" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          body: |
            Container images published to GitHub Container Registry (GHCR):
            - **Backend:** `${{ steps.meta-backend.outputs.tags }}`
            - **Frontend UI:** `${{ steps.meta-app.outputs.tags }}`
            - **Packages:** [GHCR Packages](https://github.com/${{ github.repository }}/packages)

            Attached assets include `pharmalink-${{ github.ref_name }}.zip` (backend JAR, frontend UI JAR, operational scripts, Docker configs, and Fabric org templates) as well as the packaged Hyperledger Fabric chaincode `.tar.gz` archives.
          files: |
            pharmalink-${{ github.ref_name }}.zip
            staging/chaincode-packages/*.tar.gz
